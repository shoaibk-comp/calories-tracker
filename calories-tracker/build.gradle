plugins {
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
    id 'war'
}

group = 'calories-tracker'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    
    // MySQL
    runtimeOnly 'mysql:mysql-connector-java:8.0.33'
    
    // Apache Commons
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    // Log4j dependency
    implementation 'log4j:log4j:1.2.17'

    // CSRF Token Response Header Binding Filter dependency
    // https://mvnrepository.com/artifact/com.allanditzel/spring-security-csrf-token-filter
    implementation group: 'com.allanditzel', name: 'spring-security-csrf-token-filter', version: '1.1'

    // bean validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    //implementation 'org.hsqldb:hsqldb:2.7.1'



    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.jayway.jsonpath:json-path:2.7.0'
    //testImplementation 'org.hsqldb:hsqldb:2.7.1'
    
    // Provided dependencies
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
}

test {
    useJUnit()
}

bootWar {
    enabled = true
}

